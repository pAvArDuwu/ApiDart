openapi: 3.0.0
info:
  title: API Dart - Clientes y Ventas
  version: 1.0.0
paths:
  /api/clientes:
    get:
      summary: Lista todos los Clientes
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
  /api/clientes/{id}:
    get:
      summary: Obtiene un cliente por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '404':
          description: Cliente no encontrado
  /api/ventas:
    post:
      summary: Registra una venta y descuenta el stock en una transacción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaVenta'
      responses:
        '201':
          description: Venta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaCreada'
        '400':
          description: Datos inválidos
        '409':
          description: Producto inactivo o stock insuficiente
  /api/productos:
    get:
      summary: Lista los productos
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
    post:
      summary: Crea un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoProducto'
      responses:
        '201':
          description: Producto creado
  /api/productos/{id}:
    get:
      summary: Obtiene un producto por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404':
          description: Producto no encontrado
  /api/ventas/{ventaId}/detalles:
    get:
      summary: Lista el detalle de una venta
      parameters:
        - name: ventaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalles de la venta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetalleVenta'
components:
  schemas:
    Cliente:
      type: object
      required:
        - id
        - nombre
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
    NuevaVenta:
      type: object
      required:
        - cliente_id
        - detalles
      properties:
        cliente_id:
          type: integer
        detalles:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - producto_id
              - cantidad
            properties:
              producto_id:
                type: integer
              cantidad:
                type: integer
                minimum: 1
    VentaCreada:
      type: object
      properties:
        id:
          type: integer
        total:
          type: number
          format: double
    NuevoProducto:
      type: object
      required:
        - codigo
        - nombre
        - precio
        - stock
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        precio:
          type: number
          format: double
          minimum: 0
        stock:
          type: integer
          minimum: 0
    Producto:
      allOf:
        - $ref: '#/components/schemas/NuevoProducto'
        - type: object
          required:
            - id
            - activo
          properties:
            id:
              type: integer
            activo:
              type: boolean
    DetalleVenta:
      type: object
      required:
        - id
        - venta_id
        - producto_id
        - cantidad
        - precio_unitario
        - subtotal
      properties:
        id:
          type: integer
        venta_id:
          type: integer
        producto_id:
          type: integer
        cantidad:
          type: integer
        precio_unitario:
          type: number
          format: double
        subtotal:
          type: number
          format: double